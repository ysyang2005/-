<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Trout's Promise — Frames 1-2</title>
<style>
  /* ============================================
     RESET & FULLSCREEN
     ============================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  /* ============================================
     PLAYER CONTAINER — safe-area-inset 适配
     ============================================ */
  #player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    background: #000;
    overflow: hidden;
  }

  /* ============================================
     LAYER 1: 背景图 (子帧2)
     ============================================ */
  #bgLayer {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .bg-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    filter: blur(14px) brightness(0.45) saturate(0.7);
    transform: scale(1) translate(0%, 0%);
    transition: opacity 1.6s ease, filter 1.6s ease, transform var(--motion-duration, 4s) ease-in-out;
    will-change: opacity, filter, transform;
  }

  .bg-frame.active {
    opacity: 1;
    filter: blur(0) brightness(1) saturate(1);
  }

  /* 图片加载失败占位 */
  .bg-placeholder {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1510 0%, #0d0b08 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245,240,232,0.2);
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* ============================================
     雨粒子 (子帧2)
     ============================================ */
  .rain-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image: linear-gradient(transparent 50%, rgba(255,255,255,0.03) 50%);
    background-size: 100% 4px;
    animation: rainFall 0.8s linear infinite;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.0s ease;
  }

  .rain-overlay.active {
    opacity: 0.25;
  }

  @keyframes rainFall {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
  }

  /* ============================================
     硬币3D翻转动画 (Panel 3, CSS实现)
     ============================================ */
  .bg-frame.flip-right {
    animation: flipRight 4.5s ease-in-out forwards;
    transform-style: preserve-3d;
    perspective: 1200px;
  }

  .bg-frame.flip-left {
    animation: flipLeft 4.0s ease-in-out forwards;
    transform-style: preserve-3d;
    perspective: 1200px;
  }

  @keyframes flipRight {
    0%   { transform: scale(1.07) rotateY(0deg)   rotateX(0deg); }
    20%  { transform: scale(1.08) rotateY(10deg)  rotateX(1deg); }
    40%  { transform: scale(1.095) rotateY(16deg) rotateX(2deg); }
    60%  { transform: scale(1.105) rotateY(8deg)  rotateX(1deg); }
    80%  { transform: scale(1.115) rotateY(3deg)  rotateX(0deg); }
    100% { transform: scale(1.12)  rotateY(0deg)   rotateX(0deg); }
  }

  @keyframes flipLeft {
    0%   { transform: scale(1.12)  rotateY(0deg)    rotateX(0deg); }
    20%  { transform: scale(1.13)  rotateY(-10deg)  rotateX(-1deg); }
    40%  { transform: scale(1.14)  rotateY(-16deg)  rotateX(-2deg); }
    60%  { transform: scale(1.145) rotateY(-8deg)   rotateX(-1deg); }
    80%  { transform: scale(1.15)  rotateY(-3deg)   rotateX(0deg); }
    100% { transform: scale(1.15)  rotateY(0deg)    rotateX(0deg); }
  }

  /* ============================================
     场景标签 (顶部)
     ============================================ */
  #sceneLabel {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 48px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    text-align: center;
    transition: opacity 1.2s ease;
  }

  #sceneLabel.visible {
    opacity: 1;
  }

  /* ============================================
     字幕层 (子帧3起)
     ============================================ */
  #subtitleLayer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: calc(18% + env(safe-area-inset-bottom));
  }

  .subtitle-line {
    font-family: 'Georgia', serif;
    font-style: italic;
    text-align: center;
    color: rgba(245,240,232,0.92);
    text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(12px);
    max-width: 85%;
    line-height: 1.5;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .subtitle-line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .subtitle-line.line-1 { font-size: 18px; }
  .subtitle-line.line-2 { font-size: 16px; color: rgba(245,240,232,0.75); margin-top: 6px; }

  /* ============================================
     硬币辉光 (子帧4起)
     ============================================ */
  .coin-glow {
    position: absolute;
    bottom: 22%;
    right: 18%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(212,175,55,0.5) 0%,
      rgba(212,175,55,0.15) 40%,
      transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.5s ease;
  }

  .coin-glow.active {
    animation: glowPulse 2.5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.95); }
    50% { opacity: 0.7; transform: scale(1.08); }
  }

  /* ============================================
     滑动提示 (子帧4起)
     ============================================ */
  #swipeHint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0;
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  #swipeHint.visible {
    animation: hintAppear 0.6s ease forwards, hintBounce 2s ease-in-out 0.6s infinite;
  }

  @keyframes hintAppear {
    0% { opacity: 0; }
    100% { opacity: 0.5; }
  }

  @keyframes hintBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }

  /* ============================================
     子帧1: 黑色渐入
     ============================================ */
  #blackFade {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #000;
    opacity: 1;
    pointer-events: none;
  }

  #blackFade.fading {
    animation: blackFadeIn 0.5s ease forwards;
  }

  @keyframes blackFadeIn {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ============================================
     帧标签
     ============================================ */
  #frameLabel {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 16px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(245,240,232,0.25);
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.8s ease;
    text-align: center;
  }

  #frameLabel.visible {
    opacity: 1;
  }

  /* ============================================
     开始遮罩
     ============================================ */
  #startOverlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }

  #startOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .start-title {
    font-family: 'Georgia', serif;
    font-size: 24px;
    font-style: italic;
    color: rgba(244,228,188,0.9);
    letter-spacing: 1px;
    margin-bottom: 40px;
    text-align: center;
    animation: titlePulse 3s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .start-btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: rgba(245,240,232,0.6);
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 36px;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 30px;
    background: transparent;
    animation: btnGlow 2.5s ease-in-out infinite;
  }

  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); }
    50% { box-shadow: 0 0 20px rgba(212,175,55,0.15); }
  }

  .start-hint {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(245,240,232,0.25);
    letter-spacing: 1px;
  }

  /* ============================================
     重播按钮
     ============================================ */
  #replayBtn {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,175,55,0.2);
    color: rgba(245,240,232,0.4);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.5s ease, background 0.2s ease;
  }

  #replayBtn.visible {
    opacity: 1;
  }

  #replayBtn:hover {
    background: rgba(212,175,55,0.15);
    border-color: rgba(212,175,55,0.4);
    color: rgba(244,228,188,0.8);
  }
</style>
</head>
<body>

<div id="player">

  <!-- LAYER 1: 背景图 -->

<script>
  // ============================================

  const FRAMES = [

    },
    // 子帧4: 手+真实硬币项链 + 完整钩子 + 硬币辉光 + 滑动提示

      duration: 5000,       // 5.0秒 (情绪高潮+真实产品，充分感受)
      bg: 'images/3.jpg',   // 背景图序列第3张 (真实产品照片)
      music: 'audio/1.mp3', // 继续同一首
      musicVolume: 0.2,

  const swipeHint = document.getElementById('swipeHint');
  const frameLabel = document.getElementById('frameLabel');

  const startOverlay = document.getElementById('startOverlay');
  const bgMusic = document.getElementById('bgMusic');

  // ============================================
  // 播放状态
  // ============================================
  let currentFrame = 0;
  let isPlaying = false;
  let frameTimer = null;
  let currentBg = null;  // 跟踪当前显示的背景图，相同时不切换

  // ============================================
  // 镜头运动预设（多样化 + 连贯：下一帧起始=上一帧结束）
  // ============================================
  const MOTION_PRESETS = {
    2: { startScale: 1.00, endScale: 1.05, startX: 0,  endX: -2, startY: 0,  endY: 0 },   // 推近+左移
    3: { startScale: 1.05, endScale: 1.10, startX: -2, endX: 0,  startY: 0,  endY: 0 },   // 继续推近+回中
    4: { startScale: 1.10, endScale: 1.06, startX: 0,  endX: 2,  startY: 0,  endY: 0 },   // 拉远+右移
    5: { startScale: 1.06, endScale: 1.09, startX: 2,  endX: 1,  startY: 0,  endY: 0 },   // 轻微推近+回中
    6: { startScale: 1.09, endScale: 1.03, startX: 1,  endX: 0,  startY: 0,  endY: -2 },  // 拉远+上移
    7: { startScale: 1.03, endScale: 1.07, startX: 0,  endX: 0,  startY: -2, endY: 0 },   // 推近+回中
    8: { startScale: 1.07, endScale: 1.12, startX: 0,  endX: 0,  startY: 0,  endY: 0 },   // 极慢推近(翻转)
    9: { startScale: 1.12, endScale: 1.15, startX: 0,  endX: 0,  startY: 0,  endY: 0 },   // 极慢推近(翻转)
  };

  // ============================================
  // 显示指定子帧
  // ============================================
  function showFrame(index) {
    if (index < 0 || index >= FRAMES.length) return;

    const frame = FRAMES[index];
    currentFrame = index;

    // --- 黑色渐入 ---
    if (frame.blackFade) {
      blackFade.classList.remove('fading');
      void blackFade.offsetWidth; // 强制重排
      blackFade.classList.add('fading');
      blackFade.style.opacity = ''; // 用动画控制
    } else {
      blackFade.classList.remove('fading');
      blackFade.style.opacity = '0'; // 完全透明，显示背景
    }

    // --- 硬币3D翻转 (Panel 3, CSS animation) ---
    // 先清除所有flip class
    bgFrame8.classList.remove('flip-right', 'flip-left');
    bgFrame9.classList.remove('flip-right', 'flip-left');

    // --- 背景图 ---
    // 确定要显示的背景图元素（子帧6和7共用bgFrame6，避免背景切换）
    let activeFrame = null;
    if (frame.bg === 'images/1.jpg') activeFrame = bgFrame2;
    else if (frame.bg === 'images/2.jpg') activeFrame = bgFrame3;
    else if (frame.bg === 'images/3.jpg') activeFrame = bgFrame4;
    else if (frame.bg === 'images/4.jpg') activeFrame = bgFrame5;
    else if (frame.bg === 'images/5.jpg') activeFrame = bgFrame6; // 子帧6和7共用
    else if (frame.bg === 'images/6.jpg') activeFrame = (frame.id === 8) ? bgFrame8 : bgFrame9;

    // 如果背景图与当前不同，执行切换
    if (frame.bg !== currentBg && activeFrame) {
      bgFrame2.classList.remove('active');
      bgFrame3.classList.remove('active');
      bgFrame4.classList.remove('active');
      bgFrame5.classList.remove('active');
      bgFrame6.classList.remove('active');
      bgFrame7.classList.remove('active');
      bgFrame8.classList.remove('active');
      bgFrame9.classList.remove('active');
      activeFrame.classList.add('active');
      currentBg = frame.bg;
    }

    // 添加CSS flip class (Panel 3, 跳过JS transform)
    if (activeFrame && frame.flipClass) {
      // 强制重排后添加flip class，确保animation从头播放
      void activeFrame.offsetWidth;
      activeFrame.classList.add(frame.flipClass);
    }

    // --- 镜头运动（多样化 + 连贯，不管背景是否切换都应用）---
    // 有flipClass的帧用CSS animation控制transform，跳过JS设置
    if (activeFrame && MOTION_PRESETS[frame.id] && !frame.flipClass) {
      const m = MOTION_PRESETS[frame.id];
      activeFrame.style.setProperty('--motion-duration', (frame.duration / 1000) + 's');
      // 设置起始状态（禁用transition，立即生效）
      activeFrame.style.transition = 'opacity 1.6s ease, filter 1.6s ease';
      activeFrame.style.transform = `scale(${m.startScale}) translate(${m.startX}%, ${m.startY}%)`;
      void activeFrame.offsetWidth; // 强制重排，确保起始状态生效
      // 设置结束状态（恢复transition，触发平滑过渡）
      activeFrame.style.transition = '';
      activeFrame.style.transform = `scale(${m.endScale}) translate(${m.endX}%, ${m.endY}%)`;
    }

    // --- 雨粒子 ---
    if (frame.rain) {
      rainOverlay.classList.add('active');
    } else {
      rainOverlay.classList.remove('active');
    }

    // --- 硬币辉光 ---
    if (frame.coinGlow) {
      coinGlow.classList.add('active');
    } else {
      coinGlow.classList.remove('active');
    }

    // --- Ting音效 (硬币轻响) ---
    if (frame.tingSound) {
      setTimeout(() => playTingSound(), 400); // 转场后0.4s触发
    }

    // --- 场景标签 ---
    if (frame.sceneLabel) {
      sceneLabel.textContent = frame.sceneLabel;
      sceneLabel.classList.add('visible');
    } else {
      sceneLabel.classList.remove('visible');
      sceneLabel.textContent = '';
    }

    // --- 滑动提示 ---
    if (frame.showSwipeHint) {
      swipeHint.classList.add('visible');
    } else {
      swipeHint.classList.remove('visible');
    }

    // --- 字幕 ---
    if (frame.subtitle1) {
      subLine1.textContent = frame.subtitle1;
      subLine1.classList.add('visible');
    } else {
      subLine1.classList.remove('visible');
      subLine1.textContent = '';
    }
    if (frame.subtitle2) {
      subLine2.textContent = frame.subtitle2;
      subLine2.classList.add('visible');
    } else {
      subLine2.classList.remove('visible');
      subLine2.textContent = '';
    }

    // --- 音乐 ---
    if (frame.music) {
      if (bgMusic.src !== frame.music || !bgMusic.src.includes(frame.music)) {
        bgMusic.src = frame.music;
        bgMusic.volume = frame.musicVolume || 0.2;
        bgMusic.play().catch(() => {});
      } else {
        bgMusic.volume = frame.musicVolume || 0.2;
      }
    } else {
      bgMusic.pause();
      bgMusic.currentTime = 0;
    }

    // --- 帧标签 ---
    frameLabel.textContent = `Frame ${frame.id} · ${frame.title}`;
    frameLabel.classList.add('visible');

    // --- 重播按钮 ---
    replayBtn.classList.remove('visible');

    // --- 自动跳转 ---
    clearTimeout(frameTimer);
    if (index < FRAMES.length - 1) {
      frameTimer = setTimeout(() => {
        showFrame(index + 1);
      }, frame.duration);
    } else {
      // 最后一帧：暂停，显示重播按钮
      isPlaying = false;
      setTimeout(() => {
        replayBtn.classList.add('visible');
      }, 500);
    }
  }

  // ============================================
  // 开始播放
  // ============================================
  function startPlayback() {
    startOverlay.classList.add('hidden');
    isPlaying = true;
    currentFrame = 0;
    showFrame(0);
  }

  // ============================================
  // 重播
  // ============================================
  function replay() {
    // 重置
    currentBg = null;
    bgFrame2.classList.remove('active');
    bgFrame3.classList.remove('active');
    bgFrame4.classList.remove('active');
    bgFrame5.classList.remove('active');
    bgFrame6.classList.remove('active');
    bgFrame7.classList.remove('active');
    bgFrame8.classList.remove('active', 'flip-right', 'flip-left');
    bgFrame9.classList.remove('active', 'flip-right', 'flip-left');
    // 重置所有背景图的transform
    [bgFrame2, bgFrame3, bgFrame4, bgFrame5, bgFrame6, bgFrame7, bgFrame8, bgFrame9].forEach(el => {
      el.style.transform = 'scale(1) translate(0%, 0%)';
    });
    rainOverlay.classList.remove('active');
    coinGlow.classList.remove('active');
    sceneLabel.classList.remove('visible');
    sceneLabel.textContent = '';
    swipeHint.classList.remove('visible');
    subLine1.classList.remove('visible');
    subLine1.textContent = '';
    subLine2.classList.remove('visible');
    subLine2.textContent = '';
    blackFade.classList.remove('fading');
    blackFade.style.opacity = '1';
    bgMusic.pause();
    bgMusic.currentTime = 0;
    replayBtn.classList.remove('visible');

    // 重新开始
    setTimeout(() => {
      isPlaying = true;
      currentFrame = 0;
      showFrame(0);
    }, 300);
  }

  // ============================================
  // 事件监听
  // ============================================
  startOverlay.addEventListener('click', startPlayback);
  replayBtn.addEventListener('click', replay);

  // 点击屏幕 = 下一帧 (播放中) 或 重播 (结束后)
  document.getElementById('player').addEventListener('click', (e) => {
    if (e.target.closest('#startOverlay') || e.target.closest('#replayBtn')) return;
    if (isPlaying && currentFrame < FRAMES.length - 1) {
      clearTimeout(frameTimer);
      showFrame(currentFrame + 1);
    } else if (!isPlaying) {
      replay();
    }
  });

  // 键盘控制
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!startOverlay.classList.contains('hidden')) {
        startPlayback();
      } else if (!isPlaying) {
        replay();
      }
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (isPlaying && currentFrame < FRAMES.length - 1) {
        clearTimeout(frameTimer);
        showFrame(currentFrame + 1);
      }
    }
  });

  // ============================================
  // Ting音效 — Web Audio API生成金属轻响
  // ============================================
  let audioCtx = null;

  function playTingSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      // 主音: 高频金属声 (2400Hz)
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(2400, now);
      osc1.frequency.exponentialRampToValueAtTime(1800, now + 0.4);
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.12, now + 0.01);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.6);

      // 泛音: 更高频 (3600Hz)，增加金属质感
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(3600, now);
      osc2.frequency.exponentialRampToValueAtTime(2800, now + 0.3);
      gain2.gain.setValueAtTime(0, now);
      gain2.gain.linearRampToValueAtTime(0.06, now + 0.008);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.4);

    } catch (e) {
      console.log('Ting sound not available:', e.message);
    }
  }

  // ============================================
  // 预加载素材
  // ============================================
  const preloadImg1 = new Image();
  preloadImg1.src = 'images/1.jpg';
  const preloadImg2 = new Image();
  preloadImg2.src = 'images/2.jpg';
  const preloadImg5 = new Image();
  preloadImg5.src = 'images/5.jpg';
  const preloadImg6 = new Image();
  preloadImg6.src = 'images/6.jpg';
  const preloadImg7 = new Image();
  preloadImg7.src = 'images/7.jpg';
  const preloadImg8 = new Image();
  preloadImg8.src = 'images/8.jpg';
  const preloadImg9 = new Image();
  preloadImg9.src = 'images/9.jpg';
  const preloadImg10 = new Image();
  preloadImg10.src = 'images/10.jpg';

  console.log('Frames loaded: Panel 1 (1-5) + Panel 2 (6-7) + Panel 3 (8-9 keyframe)');
  console.log('Frame 8: 4.5s — Three Trout close-up + RIGHT rotation (5 keyframes) + "Three fish. One Latin name."');
  console.log('Frame 9: 4.0s — A Promise in Metal + LEFT rotation (5 keyframes) + full narration + ting');
</script>
