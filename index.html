<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Trout's Journey — A Slovenian Coin Necklace</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================
   RESET & BASE
   ============================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0a0806;
  font-family: 'Inter', -apple-system, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  color: #f5f0e8;
}

/* ============================================
   PHONE FRAME
   ============================================ */
.phone-wrapper {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #16120d 0%, #0a0806 70%);
}
.phone-frame {
  position: relative;
  width: 100%; height: 100%;
  max-width: 430px; max-height: 932px;
  background: #000;
  overflow: hidden;
  border-radius: 0;
  box-shadow: 0 0 80px rgba(212,175,55,0.06);
}
@media (min-width: 500px) {
  .phone-frame { border-radius: 40px; border: 6px solid #15110d; }
}

/* ============================================
   SCENE SYSTEM
   ============================================ */
.scene {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity 1s cubic-bezier(0.4,0,0.2,1), visibility 1s;
  overflow: hidden;
}
.scene.active { opacity: 1; visibility: visible; }
.scene-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
}

/* Ken Burns */
.ken-burns-slow { animation: kenBurnsSlow 9s ease-in-out forwards; }
.ken-burns-in { animation: kenBurnsIn 7s ease-out forwards; }
@keyframes kenBurnsIn {
  0% { transform: scale(1.12) translate(1.5%,1%); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: scale(1.01) translate(0,0); opacity: 1; }
}
@keyframes kenBurnsSlow {
  0% { transform: scale(1) translate(0,0); }
  100% { transform: scale(1.08) translate(-1%,-0.8%); }
}

/* ============================================
   SLICE TRANSITION
   ============================================ */
.slice-overlay {
  position: absolute; inset: 0; z-index: 50;
  display: flex; pointer-events: none;
}
.slice {
  flex: 1; background: #0a0806;
  transform: scaleY(1);
  transition: transform 0.7s cubic-bezier(0.77,0,0.175,1);
}
.slice:nth-child(odd) { transform-origin: top; }
.slice:nth-child(even) { transform-origin: bottom; }
.slice-overlay.reveal .slice { transform: scaleY(0); }
.slice-overlay.reveal .slice:nth-child(1) { transition-delay: 0s; }
.slice-overlay.reveal .slice:nth-child(2) { transition-delay: 0.05s; }
.slice-overlay.reveal .slice:nth-child(3) { transition-delay: 0.1s; }
.slice-overlay.reveal .slice:nth-child(4) { transition-delay: 0.15s; }
.slice-overlay.reveal .slice:nth-child(5) { transition-delay: 0.2s; }
.slice-overlay.reveal .slice:nth-child(6) { transition-delay: 0.25s; }

/* ============================================
   PROGRESS BAR
   ============================================ */
.progress-container {
  position: absolute; top: 14px; left: 16px; right: 16px;
  display: flex; gap: 5px; z-index: 100;
}
.progress-seg {
  flex: 1; height: 2px;
  background: rgba(245,240,232,0.15);
  border-radius: 2px; overflow: hidden;
}
.progress-seg-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #d4af37, #f4e4bc);
  border-radius: 2px;
  transition: width 0.1s linear;
}
.progress-seg.complete .progress-seg-fill { width: 100%; }

/* ============================================
   SCENE LABEL — 极简场景名
   ============================================ */
.scene-label {
  position: absolute; bottom: 62px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 500;
  letter-spacing: 3px; text-transform: uppercase;
  color: rgba(245,240,232,0.85);
  text-shadow: 0 1px 8px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.4);
  z-index: 10; opacity: 0;
  white-space: nowrap;
}
.scene-label.go { animation: fadeIn 1.5s ease 0.5s forwards; }
@keyframes fadeIn { to { opacity: 1; } }

/* ============================================
   PARTICLE CANVAS
   ============================================ */
.particle-canvas {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
}

/* ============================================
   VIGNETTE — 暗角增强电影感
   ============================================ */
.vignette {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(10,8,6,0.35) 100%);
}

/* ============================================
   CONTROLS
   ============================================ */
.controls {
  position: absolute; bottom: 16px; right: 14px;
  z-index: 100; display: flex; gap: 6px;
}
.ctrl-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(10,8,6,0.4); backdrop-filter: blur(8px);
  border: 1px solid rgba(245,240,232,0.1);
  color: rgba(245,240,232,0.7); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.ctrl-btn:hover { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.25); color: #d4af37; }
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn.music-on { background: rgba(212,175,55,0.2); border-color: rgba(212,175,55,0.4); color: #d4af37; }

/* Scene dots */
.scene-dots {
  position: absolute; bottom: 22px; left: 50%;
  transform: translateX(-50%); display: flex; gap: 4px; z-index: 50;
}
.scene-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(245,240,232,0.2); transition: all 0.4s ease;
}
.scene-dot.active { background: #d4af37; width: 14px; border-radius: 3px; }

/* Tap hint */
.tap-hint {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 40px; color: rgba(245,240,232,0.6);
  z-index: 200; opacity: 0; pointer-events: none;
}
.tap-hint.show { animation: tapFade 0.8s ease forwards; }
@keyframes tapFade {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
}

/* Brand mark */
.brand-mark {
  position: absolute; bottom: 18px; left: 18px; z-index: 50;
  font-family: 'Playfair Display', serif; font-size: 11px;
  color: rgba(245,240,232,0.5); letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div class="phone-wrapper">
<div class="phone-frame" id="phoneFrame">

  <!-- Progress Bar -->
  <div class="progress-container" id="progressContainer"></div>

  <!-- Slice Transition Overlay -->
  <div class="slice-overlay" id="sliceOverlay">
    <div class="slice"></div><div class="slice"></div><div class="slice"></div>
    <div class="slice"></div><div class="slice"></div><div class="slice"></div>
  </div>

  <!-- Tap hint -->
  <div class="tap-hint" id="tapHint">⏸</div>

  <!-- ==================== SCENE 1: THE STREAM ==================== -->
  <div class="scene" id="scene-0">
    <div class="scene-bg ken-burns-slow" style="background-image:url('images/01-the-stream.jpg');"></div>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">The Stream · 起源</div>
  </div>

  <!-- ==================== SCENE 2: THE ARCHIVE ==================== -->
  <div class="scene" id="scene-1">
    <div class="scene-bg ken-burns-in" style="background-image:url('images/02-the-archive.jpg');"></div>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">The Archive · 印记</div>
  </div>

  <!-- ==================== SCENE 3: MORNING LIGHT ==================== -->
  <div class="scene" id="scene-2">
    <div class="scene-bg ken-burns-slow" style="background-image:url('images/03-morning-light.jpg');"></div>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">Morning Light · 日常</div>
  </div>

  <!-- ==================== SCENE 4: THE PROMISE ==================== -->
  <div class="scene" id="scene-3">
    <div class="scene-bg ken-burns-in" style="background-image:url('images/04-the-promise.jpg');"></div>
    <canvas class="particle-canvas" id="particles-4"></canvas>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">The Promise · 守护</div>
  </div>

  <!-- ==================== SCENE 5: THE GIFT ==================== -->
  <div class="scene" id="scene-4">
    <div class="scene-bg ken-burns-slow" style="background-image:url('images/05-the-gift.jpg');"></div>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">The Gift · 送礼</div>
  </div>

  <!-- ==================== SCENE 6: WHISPER ==================== -->
  <div class="scene" id="scene-5">
    <div class="scene-bg ken-burns-in" style="background-image:url('images/06-whisper.jpg');"></div>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">Whisper · 贴近</div>
  </div>

  <!-- ==================== SCENE 7: ETERNAL ==================== -->
  <div class="scene" id="scene-6">
    <div class="scene-bg" style="background-image:url('images/07-eternal.jpg');"></div>
    <canvas class="particle-canvas" id="particles-7"></canvas>
    <div class="vignette"></div>
    <div class="scene-label" data-anim="label">Eternal · 永恒</div>
  </div>

  <!-- Brand mark -->
  <div class="brand-mark">GlobalFun Go</div>

  <!-- Scene dots -->
  <div class="scene-dots" id="sceneDots"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="musicBtn" title="Music on/off">🎵</button>
    <button class="ctrl-btn" id="playPauseBtn" title="Play / Pause">⏸</button>
    <button class="ctrl-btn" id="replayBtn" title="Replay">↻</button>
  </div>

</div>
</div>

<script>
// ============================================
// CONFIG — 7 scenes, contemplative pacing
// ============================================
const DURATIONS = [3000, 3000, 3000, 3500, 3000, 3000, 999999];
const TOTAL = 7;

// ============================================
// STATE
// ============================================
let current = 0;
let playing = true;
let sceneTimer = null;
let progTimer = null;
let sceneStart = 0;

// ============================================
// DOM
// ============================================
const scenes = document.querySelectorAll('.scene');
const progContainer = document.getElementById('progressContainer');
const dotsContainer = document.getElementById('sceneDots');
const playBtn = document.getElementById('playPauseBtn');
const replayBtn = document.getElementById('replayBtn');
const musicBtn = document.getElementById('musicBtn');
const tapHint = document.getElementById('tapHint');
const phoneFrame = document.getElementById('phoneFrame');
const sliceOverlay = document.getElementById('sliceOverlay');

// Init progress + dots
for (let i = 0; i < TOTAL; i++) {
  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.innerHTML = '<div class="progress-seg-fill"></div>';
  progContainer.appendChild(seg);
  const dot = document.createElement('div');
  dot.className = 'scene-dot' + (i === 0 ? ' active' : '');
  dotsContainer.appendChild(dot);
}
const progSegs = document.querySelectorAll('.progress-seg');
const dots = document.querySelectorAll('.scene-dot');

// ============================================
// SCENE ANIMATION TRIGGERS
// ============================================
function triggerAnimations(sceneIdx) {
  const scene = scenes[sceneIdx];
  const animEls = scene.querySelectorAll('[data-anim]');
  animEls.forEach(el => {
    el.classList.remove('go');
    void el.offsetWidth;
  });
  animEls.forEach(el => {
    setTimeout(() => {
      if (current !== sceneIdx || !playing) return;
      el.classList.add('go');
    }, 600);
  });
}

// ============================================
// SLICE TRANSITION
// ============================================
function runSliceTransition(callback) {
  sliceOverlay.classList.remove('reveal');
  void sliceOverlay.offsetWidth;
  setTimeout(() => {
    callback();
    setTimeout(() => {
      sliceOverlay.classList.add('reveal');
    }, 80);
  }, 50);
}

// ============================================
// GO TO SCENE
// ============================================
function goToScene(idx) {
  if (idx < 0 || idx >= TOTAL) return;
  clearTimeout(sceneTimer);
  clearInterval(progTimer);

  if (idx !== current) {
    runSliceTransition(() => {
      scenes.forEach(s => s.classList.remove('active'));
      progSegs.forEach((s, i) => {
        s.classList.remove('complete');
        s.querySelector('.progress-seg-fill').style.width = i < idx ? '100%' : '0%';
      });
      dots.forEach(d => d.classList.remove('active'));
      current = idx;
      scenes[idx].classList.add('active');
      dots[idx].classList.add('active');
      triggerAnimations(idx);
      startProgress(idx);
    });
  } else {
    scenes[idx].classList.add('active');
    triggerAnimations(idx);
    startProgress(idx);
  }
}

function startProgress(idx) {
  sceneStart = Date.now();
  const dur = DURATIONS[idx];
  if (dur >= 999999) {
    progSegs[idx].querySelector('.progress-seg-fill').style.width = '100%';
    return;
  }
  progTimer = setInterval(() => {
    if (!playing) return;
    const elapsed = Date.now() - sceneStart;
    const pct = Math.min((elapsed / dur) * 100, 100);
    progSegs[idx].querySelector('.progress-seg-fill').style.width = pct + '%';
  }, 60);
  sceneTimer = setTimeout(() => {
    progSegs[idx].classList.add('complete');
    if (idx < TOTAL - 1) goToScene(idx + 1);
  }, dur);
}

// ============================================
// PARTICLE SYSTEM — Gold dust
// ============================================
function initParticles(canvasId, count, speed) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;
  canvas.width = parent.offsetWidth;
  canvas.height = parent.offsetHeight;

  const particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.4,
      dx: (Math.random() - 0.5) * speed,
      dy: -Math.random() * speed - 0.12,
      alpha: Math.random() * 0.45 + 0.12,
      pulse: Math.random() * Math.PI * 2
    });
  }

  let rafId;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      p.pulse += 0.02;
      if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
      if (p.x < -5) p.x = canvas.width + 5;
      if (p.x > canvas.width + 5) p.x = -5;
      const a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,175,55,${a})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(212,175,55,0.5)';
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    rafId = requestAnimationFrame(animate);
  }
  animate();
  return () => cancelAnimationFrame(rafId);
}

// ============================================
// AMBIENT MUSIC — Web Audio API
// ============================================
let audioCtx = null;
let musicPlaying = false;
let musicNodes = [];
let musicInterval = null;

// C minor pentatonic — warm, melancholic, elegant
const NOTES = [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(freq, duration, startTime, gainVal) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.value = freq;
  filter.type = 'lowpass';
  filter.frequency.value = 1200;
  filter.Q.value = 0.5;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.1);
  musicNodes.push(osc, gain, filter);
}

function playPad(freq, duration, startTime) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 1.5;
  osc2.detune.value = 5;
  filter.type = 'lowpass';
  filter.frequency.value = 600;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(0.05, startTime + 1.5);
  gain.gain.setValueAtTime(0.05, startTime + duration - 1.5);
  gain.gain.linearRampToValueAtTime(0.001, startTime + duration);
  osc.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc2.start(startTime);
  osc.stop(startTime + duration + 0.1);
  osc2.stop(startTime + duration + 0.1);
  musicNodes.push(osc, osc2, gain, filter);
}

function musicLoop() {
  if (!audioCtx || !musicPlaying) return;
  const now = audioCtx.currentTime;
  const barLen = 4.0;
  playPad(130.81, barLen * 2, now);
  playPad(155.56, barLen * 2, now + 0.3);
  const melody = [0, 2, 4, 3, 5, 4, 2, 1];
  melody.forEach((idx, i) => {
    const noteFreq = NOTES[idx] * 2;
    playNote(noteFreq, 1.8, now + i * 0.5, 0.035);
  });
  setTimeout(() => {
    if (musicPlaying && audioCtx) {
      playNote(NOTES[6] * 4, 2.5, audioCtx.currentTime, 0.018);
    }
  }, 2000);
}

function startMusic() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
  musicBtn.classList.add('music-on');
  musicBtn.textContent = '🎵';
  musicLoop();
  musicInterval = setInterval(musicLoop, 8000);
}

function stopMusic() {
  musicPlaying = false;
  musicBtn.classList.remove('music-on');
  musicBtn.textContent = '🔇';
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  musicNodes.forEach(n => {
    try {
      if (n.gain) n.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
      if (n.stop) n.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
  });
  musicNodes = [];
}

function toggleMusic() {
  if (musicPlaying) stopMusic();
  else startMusic();
}

// ============================================
// CONTROLS
// ============================================
function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  if (playing) {
    const elapsed = Date.now() - sceneStart;
    const remaining = DURATIONS[current] - elapsed;
    if (remaining > 0 && remaining < 999999) {
      clearTimeout(sceneTimer);
      sceneTimer = setTimeout(() => {
        progSegs[current].classList.add('complete');
        if (current < TOTAL - 1) goToScene(current + 1);
      }, remaining);
    }
  } else {
    clearTimeout(sceneTimer);
    clearInterval(progTimer);
  }
}

function replay() {
  goToScene(0);
  playing = true;
  playBtn.textContent = '⏸';
}

playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
replayBtn.addEventListener('click', e => { e.stopPropagation(); replay(); });
musicBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });

// Tap to pause
phoneFrame.addEventListener('click', e => {
  if (e.target.closest('.ctrl-btn')) return;
  togglePlay();
  tapHint.classList.remove('show');
  tapHint.textContent = playing ? '⏸' : '▶';
  void tapHint.offsetWidth;
  tapHint.classList.add('show');
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && current < TOTAL - 1) goToScene(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) goToScene(current - 1);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'r' || e.key === 'R') replay();
});

// Touch swipe
let touchX = 0;
phoneFrame.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
phoneFrame.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchX;
  if (Math.abs(diff) > 55) {
    if (diff < 0 && current < TOTAL - 1) goToScene(current + 1);
    if (diff > 0 && current > 0) goToScene(current - 1);
  }
}, { passive: true });

// Resize
window.addEventListener('resize', () => {
  ['particles-4','particles-7'].forEach(id => {
    const c = document.getElementById(id);
    if (c) { c.width = c.parentElement.offsetWidth; c.height = c.parentElement.offsetHeight; }
  });
});

// ============================================
// START
// ============================================
let musicStarted = false;
function tryStartMusic() {
  if (!musicStarted) {
    musicStarted = true;
    startMusic();
  }
}
document.addEventListener('click', tryStartMusic, { once: true });
document.addEventListener('touchstart', tryStartMusic, { once: true });
document.addEventListener('keydown', tryStartMusic, { once: true });

window.addEventListener('load', () => {
  initParticles('particles-4', 35, 0.3);
  initParticles('particles-7', 45, 0.25);
  setTimeout(() => goToScene(0), 400);
  setTimeout(tryStartMusic, 800);
});
</script>

</body>
</html>
