<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Trout's Journey — GlobalFun Go</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0c0a08;font-family:'Inter',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;color:#f5f0e8}

.phone-wrapper{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a1510 0%,#0c0a08 70%)}
.phone-frame{position:relative;width:100%;height:100%;max-width:430px;max-height:932px;background:#000;overflow:hidden;border-radius:0;box-shadow:0 0 80px rgba(212,175,55,0.08)}
@media(min-width:500px){.phone-frame{border-radius:40px;border:6px solid #1a1714}}

/* ===== SCENE SYSTEM ===== */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s cubic-bezier(0.4,0,0.2,1),visibility 1s;overflow:hidden}
.scene.active{opacity:1;visibility:visible}
.scene-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}

/* Ken Burns */
.ken-in{animation:kenIn 7s ease-out forwards}
.ken-slow{animation:kenSlow 8s ease-in-out infinite alternate}
@keyframes kenIn{0%{transform:scale(1.12) translate(1%,1%);opacity:0}10%{opacity:1}100%{transform:scale(1) translate(0,0);opacity:1}}
@keyframes kenSlow{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,-1%)}}

/* ===== SLICE TRANSITION ===== */
.slice-overlay{position:absolute;inset:0;z-index:50;display:flex;pointer-events:none}
.slice{flex:1;background:#0c0a08;transform:scaleY(1);transition:transform 0.8s cubic-bezier(0.77,0,0.175,1)}
.slice:nth-child(odd){transform-origin:top}
.slice:nth-child(even){transform-origin:bottom}
.slice-overlay.reveal .slice{transform:scaleY(0)}
.slice-overlay.reveal .slice:nth-child(1){transition-delay:0s}
.slice-overlay.reveal .slice:nth-child(2){transition-delay:0.06s}
.slice-overlay.reveal .slice:nth-child(3){transition-delay:0.12s}
.slice-overlay.reveal .slice:nth-child(4){transition-delay:0.18s}
.slice-overlay.reveal .slice:nth-child(5){transition-delay:0.24s}
.slice-overlay.reveal .slice:nth-child(6){transition-delay:0.30s}

/* ===== PROGRESS BAR — Segmented ===== */
.progress-container{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:5px;z-index:100}
.progress-seg{flex:1;height:2.5px;background:rgba(245,240,232,0.2);border-radius:2px;overflow:hidden}
.progress-seg-fill{height:100%;width:0%;background:linear-gradient(90deg,#d4af37,#f4e4bc);border-radius:2px;transition:width 0.1s linear}
.progress-seg.complete .progress-seg-fill{width:100%}

/* ===== VISUAL EFFECTS ===== */
.film-grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(12,10,8,0.4) 100%)}
.warm-overlay{position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(to top,rgba(255,170,80,0.15) 0%,transparent 55%)}

/* ===== SCENE LABELS (subtle, no duplicate text) ===== */
.scene-tag{position:absolute;top:56px;left:24px;z-index:10;background:rgba(12,10,8,0.6);backdrop-filter:blur(8px);border:1px solid rgba(212,175,55,0.2);padding:5px 14px;border-radius:20px;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:rgba(212,175,55,0.8);opacity:0}
.scene-tag.go{animation:fadeIn 0.8s ease forwards}
@keyframes fadeIn{to{opacity:1}}

/* REC timestamp for gift scene */
.timestamp{position:absolute;top:56px;left:24px;z-index:10;font-family:'Courier New',monospace;font-size:11px;color:rgba(245,240,232,0.7);letter-spacing:1px;opacity:0}
.timestamp.go{animation:fadeIn 0.8s ease forwards}
.rec-dot{display:inline-block;width:7px;height:7px;background:#ff3b30;border-radius:50%;margin-right:7px;animation:blink 1.2s ease-in-out infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0.3}}

/* ===== CTA SCENE ===== */
.cta-scene{background:linear-gradient(165deg,#14110e 0%,#1f1a14 45%,#14110e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center}
#cta-particles{position:absolute;inset:0;z-index:1;pointer-events:none}
.cta-content{position:relative;z-index:5}
.cta-eyebrow{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#d4af37;margin-bottom:20px;opacity:0}
.cta-eyebrow.go{animation:fadeIn 1s ease forwards}
.cta-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;color:#f5f0e8;line-height:1.2;margin-bottom:10px;opacity:0}
.cta-title.go{animation:fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cta-subtitle{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:rgba(245,240,232,0.65);margin-bottom:24px;opacity:0}
.cta-subtitle.go{animation:fadeIn 1.2s ease 0.3s forwards}
.cta-price{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;color:#d4af37;margin-bottom:6px;opacity:0}
.cta-price.go{animation:fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.5s forwards}
.cta-price .from{font-size:16px;font-weight:400;color:rgba(212,175,55,0.6);font-family:'Inter',sans-serif}
.cta-urgency{font-size:11px;color:rgba(245,240,232,0.45);letter-spacing:0.5px;margin-bottom:32px;opacity:0}
.cta-urgency.go{animation:fadeIn 1s ease 0.8s forwards}
.cta-btn{display:inline-block;background:linear-gradient(135deg,#d4af37,#e8d5a0);color:#1a1714;padding:16px 52px;border-radius:50px;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border:none;box-shadow:0 4px 30px rgba(212,175,55,0.4);transition:transform 0.25s ease,box-shadow 0.25s ease;cursor:pointer;opacity:0}
.cta-btn.go{animation:btnIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 1s forwards,btnPulse 2.8s ease-in-out 2s infinite}
@keyframes btnIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 30px rgba(212,175,55,0.4)}50%{box-shadow:0 4px 50px rgba(212,175,55,0.7)}}
.cta-btn:hover{transform:scale(1.06)}
.cta-btn:active{transform:scale(0.97)}
.cta-link{display:block;margin-top:20px;font-size:12px;color:rgba(245,240,232,0.4);text-decoration:none;letter-spacing:0.5px;opacity:0;transition:color 0.2s}
.cta-link.go{animation:fadeIn 1s ease 1.4s forwards}
.cta-link:hover{color:#d4af37}
.cta-features{margin-top:30px;display:flex;gap:18px;font-size:10px;color:rgba(245,240,232,0.35);letter-spacing:0.5px;opacity:0}
.cta-features.go{animation:fadeIn 1s ease 1.7s forwards}
.cta-features span{display:flex;align-items:center;gap:4px}

/* ===== CONTROLS ===== */
.controls{position:absolute;bottom:18px;right:16px;z-index:100;display:flex;gap:8px}
.ctrl-btn{width:38px;height:38px;border-radius:50%;background:rgba(12,10,8,0.5);backdrop-filter:blur(10px);border:1px solid rgba(245,240,232,0.12);color:#f5f0e8;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s ease}
.ctrl-btn:hover{background:rgba(212,175,55,0.2);border-color:rgba(212,175,55,0.3)}
.ctrl-btn:active{transform:scale(0.92)}
.ctrl-btn.music-on{background:rgba(212,175,55,0.25);border-color:rgba(212,175,55,0.5);color:#d4af37}

.scene-dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:50}
.scene-dot{width:5px;height:5px;border-radius:50%;background:rgba(245,240,232,0.25);transition:all 0.4s ease}
.scene-dot.active{background:#d4af37;width:16px;border-radius:3px}

.tap-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;color:rgba(245,240,232,0.7);z-index:200;opacity:0;pointer-events:none}
.tap-hint.show{animation:tapFade 0.9s ease forwards}
@keyframes tapFade{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

.brand-mark{position:absolute;bottom:18px;left:20px;z-index:50;font-family:'Playfair Display',serif;font-size:11px;color:rgba(245,240,232,0.3);letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>

<div class="phone-wrapper">
<div class="phone-frame" id="phoneFrame">

  <!-- Progress Bar -->
  <div class="progress-container" id="progressContainer"></div>

  <!-- Slice Transition Overlay -->
  <div class="slice-overlay" id="sliceOverlay">
    <div class="slice"></div><div class="slice"></div><div class="slice"></div>
    <div class="slice"></div><div class="slice"></div><div class="slice"></div>
  </div>

  <!-- Tap hint -->
  <div class="tap-hint" id="tapHint">⏸</div>

  <!-- ===== SCENE 1: HERO ===== -->
  <div class="scene" id="scene-0">
    <div class="scene-bg ken-slow" style="background-image:url('01-hero.jpg');"></div>
    <canvas id="hero-particles"></canvas>
  </div>

  <!-- ===== SCENE 2: DETAILS ===== -->
  <div class="scene" id="scene-1">
    <div class="scene-bg ken-in" style="background-image:url('02-details.jpg');"></div>
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scene-tag" data-anim="scene-tag">The Details</div>
  </div>

  <!-- ===== SCENE 3: STORY ===== -->
  <div class="scene" id="scene-2">
    <div class="scene-bg ken-slow" style="background-image:url('03-story.jpg');"></div>
    <div class="warm-overlay"></div>
    <div class="scene-tag" data-anim="scene-tag">The Story</div>
  </div>

  <!-- ===== SCENE 4: LIFESTYLE ===== -->
  <div class="scene" id="scene-3">
    <div class="scene-bg ken-in" style="background-image:url('04-lifestyle.jpg');"></div>
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scene-tag" data-anim="scene-tag">Everyday</div>
  </div>

  <!-- ===== SCENE 5: GIFT ===== -->
  <div class="scene" id="scene-4">
    <div class="scene-bg ken-slow" style="background-image:url('05-gift.jpg');"></div>
    <div class="warm-overlay"></div>
    <div class="timestamp" data-anim="timestamp"><span class="rec-dot"></span>GIFT MOMENT · REC</div>
  </div>

  <!-- ===== SCENE 6: CTA ===== -->
  <div class="scene cta-scene" id="scene-5">
    <canvas id="cta-particles"></canvas>
    <div class="cta-content">
      <div class="cta-eyebrow" data-anim="cta-eyebrow">GlobalFun Go</div>
      <div class="cta-title" data-anim="cta-title">The Slovenian<br>Trout Necklace</div>
      <div class="cta-subtitle" data-anim="cta-subtitle">Three fish. One love story.</div>
      <div class="cta-price" data-anim="cta-price"><span class="from">from</span> £29.9</div>
      <div class="cta-urgency" data-anim="cta-urgency">Limited stock · Each coin is one of a kind</div>
      <a href="#" class="cta-btn" data-anim="cta-btn" onclick="return false;">Shop Now</a>
      <a href="#" class="cta-link" data-anim="cta-link" onclick="return false;">View on Etsy →</a>
      <div class="cta-features" data-anim="cta-features">
        <span>🚚 Free UK delivery</span>
        <span>↩ 30-day returns</span>
        <span>🌿 Hypoallergenic</span>
      </div>
    </div>
  </div>

  <!-- Brand mark -->
  <div class="brand-mark">GlobalFun Go</div>

  <!-- Scene dots -->
  <div class="scene-dots" id="sceneDots"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="musicBtn" title="Music on/off">🎵</button>
    <button class="ctrl-btn" id="playPauseBtn" title="Play / Pause">⏸</button>
    <button class="ctrl-btn" id="replayBtn" title="Replay">↻</button>
  </div>

</div>
</div>

<script>
// ===== CONFIG — 6 scenes =====
const DURATIONS = [3500, 4000, 4000, 3500, 4000, 999999];
const TOTAL = 6;

// ===== STATE =====
let current = 0;
let playing = true;
let sceneTimer = null;
let progTimer = null;
let sceneStart = 0;

// ===== DOM =====
const scenes = document.querySelectorAll('.scene');
const progContainer = document.getElementById('progressContainer');
const dotsContainer = document.getElementById('sceneDots');
const playBtn = document.getElementById('playPauseBtn');
const replayBtn = document.getElementById('replayBtn');
const musicBtn = document.getElementById('musicBtn');
const tapHint = document.getElementById('tapHint');
const phoneFrame = document.getElementById('phoneFrame');
const sliceOverlay = document.getElementById('sliceOverlay');

// Init progress + dots
for (let i = 0; i < TOTAL; i++) {
  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.innerHTML = '<div class="progress-seg-fill"></div>';
  progContainer.appendChild(seg);
  const dot = document.createElement('div');
  dot.className = 'scene-dot' + (i === 0 ? ' active' : '');
  dotsContainer.appendChild(dot);
}
const progSegs = document.querySelectorAll('.progress-seg');
const dots = document.querySelectorAll('.scene-dot');

// ===== SCENE ANIMATION TRIGGERS =====
function triggerAnimations(sceneIdx) {
  const scene = scenes[sceneIdx];
  const animEls = scene.querySelectorAll('[data-anim]');
  animEls.forEach(el => {
    el.classList.remove('go');
    void el.offsetWidth;
  });
  const delays = {
    1: { 'scene-tag': 400 },
    2: { 'scene-tag': 400 },
    3: { 'scene-tag': 400 },
    4: { 'timestamp': 300 },
    5: { 'cta-eyebrow': 200, 'cta-title': 400, 'cta-subtitle': 700, 'cta-price': 1000, 'cta-urgency': 1300, 'cta-btn': 1600, 'cta-link': 2000, 'cta-features': 2300 }
  };
  const sceneDelays = delays[sceneIdx] || {};
  animEls.forEach(el => {
    const key = el.dataset.anim;
    const delay = sceneDelays[key] || 500;
    setTimeout(() => {
      if (current !== sceneIdx || !playing) return;
      el.classList.add('go');
    }, delay);
  });
}

// ===== SLICE TRANSITION =====
function runSliceTransition(callback) {
  sliceOverlay.classList.remove('reveal');
  void sliceOverlay.offsetWidth;
  setTimeout(() => {
    callback();
    setTimeout(() => { sliceOverlay.classList.add('reveal'); }, 100);
  }, 50);
}

// ===== GO TO SCENE =====
function goToScene(idx) {
  if (idx < 0 || idx >= TOTAL) return;
  clearTimeout(sceneTimer);
  clearInterval(progTimer);
  if (idx !== current) {
    runSliceTransition(() => {
      scenes.forEach(s => s.classList.remove('active'));
      progSegs.forEach((s, i) => {
        s.classList.remove('complete');
        s.querySelector('.progress-seg-fill').style.width = i < idx ? '100%' : '0%';
      });
      dots.forEach(d => d.classList.remove('active'));
      current = idx;
      scenes[idx].classList.add('active');
      dots[idx].classList.add('active');
      triggerAnimations(idx);
      startProgress(idx);
    });
  } else {
    scenes[idx].classList.add('active');
    triggerAnimations(idx);
    startProgress(idx);
  }
}

function startProgress(idx) {
  sceneStart = Date.now();
  const dur = DURATIONS[idx];
  if (dur >= 999999) {
    progSegs[idx].querySelector('.progress-seg-fill').style.width = '100%';
    return;
  }
  progTimer = setInterval(() => {
    if (!playing) return;
    const elapsed = Date.now() - sceneStart;
    const pct = Math.min((elapsed / dur) * 100, 100);
    progSegs[idx].querySelector('.progress-seg-fill').style.width = pct + '%';
  }, 60);
  sceneTimer = setTimeout(() => {
    progSegs[idx].classList.add('complete');
    if (idx < TOTAL - 1) goToScene(idx + 1);
  }, dur);
}

// ===== PARTICLE SYSTEM =====
function initParticles(canvasId, count, speed) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;
  canvas.width = parent.offsetWidth;
  canvas.height = parent.offsetHeight;
  const particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * speed,
      dy: -Math.random() * speed - 0.15,
      alpha: Math.random() * 0.5 + 0.15,
      pulse: Math.random() * Math.PI * 2
    });
  }
  let rafId;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy; p.pulse += 0.025;
      if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
      if (p.x < -5) p.x = canvas.width + 5;
      if (p.x > canvas.width + 5) p.x = -5;
      const a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,175,55,${a})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(212,175,55,0.6)';
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    rafId = requestAnimationFrame(animate);
  }
  animate();
  return () => cancelAnimationFrame(rafId);
}

// ===== AMBIENT MUSIC — Web Audio =====
let audioCtx = null, musicPlaying = false, musicNodes = [], musicInterval = null;
const NOTES = [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23];

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playNote(freq, duration, startTime, gainVal) {
  if (!audioCtx) return;
  const t = startTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
  osc.type = 'sine'; osc.frequency.value = freq;
  filter.type = 'lowpass'; filter.frequency.value = 1200; filter.Q.value = 0.5;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(gainVal, t + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration + 0.1);
  musicNodes.push(osc, gain, filter);
}

function playPad(freq, duration, startTime) {
  if (!audioCtx) return;
  const t = startTime;
  const osc = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), gain = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
  osc.type = 'sine'; osc.frequency.value = freq;
  osc2.type = 'sine'; osc2.frequency.value = freq * 1.5; osc2.detune.value = 5;
  filter.type = 'lowpass'; filter.frequency.value = 600;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.06, t + 1.5);
  gain.gain.setValueAtTime(0.06, t + duration - 1.5);
  gain.gain.linearRampToValueAtTime(0.001, t + duration);
  osc.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc2.start(t); osc.stop(t + duration + 0.1); osc2.stop(t + duration + 0.1);
  musicNodes.push(osc, osc2, gain, filter);
}

function musicLoop() {
  if (!audioCtx || !musicPlaying) return;
  const now = audioCtx.currentTime;
  playPad(130.81, 8, now);
  playPad(155.56, 8, now + 0.3);
  const melody = [0, 2, 4, 3, 5, 4, 2, 1];
  melody.forEach((idx, i) => playNote(NOTES[idx] * 2, 1.8, now + i * 0.5, 0.04));
  setTimeout(() => { if (musicPlaying && audioCtx) playNote(NOTES[6] * 4, 2.5, audioCtx.currentTime, 0.02); }, 2000);
}

function startMusic() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
  musicBtn.classList.add('music-on');
  musicBtn.textContent = '🎵';
  musicLoop();
  musicInterval = setInterval(musicLoop, 8000);
}

function stopMusic() {
  musicPlaying = false;
  musicBtn.classList.remove('music-on');
  musicBtn.textContent = '🔇';
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  musicNodes.forEach(n => {
    try { if (n.gain) n.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3); if (n.stop) n.stop(audioCtx.currentTime + 0.5); } catch(e) {}
  });
  musicNodes = [];
}

function toggleMusic() { if (musicPlaying) stopMusic(); else startMusic(); }

// ===== CONTROLS =====
function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  if (playing) {
    const elapsed = Date.now() - sceneStart;
    const remaining = DURATIONS[current] - elapsed;
    if (remaining > 0 && remaining < 999999) {
      clearTimeout(sceneTimer);
      sceneTimer = setTimeout(() => {
        progSegs[current].classList.add('complete');
        if (current < TOTAL - 1) goToScene(current + 1);
      }, remaining);
    }
  } else {
    clearTimeout(sceneTimer);
    clearInterval(progTimer);
  }
}

function replay() { goToScene(0); playing = true; playBtn.textContent = '⏸'; }

playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
replayBtn.addEventListener('click', e => { e.stopPropagation(); replay(); });
musicBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });

phoneFrame.addEventListener('click', e => {
  if (e.target.closest('.ctrl-btn') || e.target.closest('.cta-btn') || e.target.closest('.cta-link')) return;
  togglePlay();
  tapHint.classList.remove('show');
  tapHint.textContent = playing ? '⏸' : '▶';
  void tapHint.offsetWidth;
  tapHint.classList.add('show');
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && current < TOTAL - 1) goToScene(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) goToScene(current - 1);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'r' || e.key === 'R') replay();
});

let touchX = 0;
phoneFrame.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
phoneFrame.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchX;
  if (Math.abs(diff) > 55) {
    if (diff < 0 && current < TOTAL - 1) goToScene(current + 1);
    if (diff > 0 && current > 0) goToScene(current - 1);
  }
}, { passive: true });

window.addEventListener('resize', () => {
  ['hero-particles','cta-particles'].forEach(id => {
    const c = document.getElementById(id);
    if (c) { c.width = c.parentElement.offsetWidth; c.height = c.parentElement.offsetHeight; }
  });
});

// ===== START =====
let musicStarted = false;
function tryStartMusic() { if (!musicStarted) { musicStarted = true; startMusic(); } }
document.addEventListener('click', tryStartMusic, { once: true });
document.addEventListener('touchstart', tryStartMusic, { once: true });
document.addEventListener('keydown', tryStartMusic, { once: true });

window.addEventListener('load', () => {
  initParticles('hero-particles', 40, 0.35);
  initParticles('cta-particles', 25, 0.25);
  setTimeout(() => goToScene(0), 400);
  setTimeout(tryStartMusic, 800);
});
</script>

</body>
</html>
